services:
  relanox:
    build: .
    image: relanox:local
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./deploy/relanox.json:/config/relanox.json:ro
      - relay-data:/data
    stop_grace_period: 20s

volumes:
  relay-data:
