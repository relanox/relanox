packages:
  - packages/*
  - plugins/*
  - apps/*

# Keep the Tencent SDK's CJS v4() call while avoiding GHSA-w5hq-g745-h8pq.
overrides:
  tencentcloud-sdk-nodejs-common@4.1.220>uuid: 11.1.1

# Exact-version exceptions to the release-age policy.
minimumReleaseAgeExclude:
  - oxlint-tsgolint@7.0.2004
  - '@oxlint-tsgolint/darwin-arm64@7.0.2004'
  - '@oxlint-tsgolint/darwin-x64@7.0.2004'
  - '@oxlint-tsgolint/linux-arm64@7.0.2004'
  - '@oxlint-tsgolint/linux-x64@7.0.2004'
  - '@oxlint-tsgolint/win32-arm64@7.0.2004'
  - '@oxlint-tsgolint/win32-x64@7.0.2004'
  - process-warning@5.1.1
  - prettier@3.9.10

# esbuild verifies its pinned optional platform binary during installation.
allowBuilds:
  # Only warns about dependent version ranges; no build output is needed.
  protobufjs@7.6.6: false
  esbuild@0.28.2: true
  esbuild@0.21.5: true
  esbuild@0.18.20: true
  esbuild@0.25.12: true

patchedDependencies:
  # SDK issue #27: tolerate delayed ACKs; retain upload errors for Core classification.
  '@wecom/aibot-node-sdk@1.0.7': plugins/channel-wecom/patches/@wecom__aibot-node-sdk@1.0.7.patch
