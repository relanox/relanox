groups:
  - name: relanox
    rules:
      - alert: RelanoxUnknownEffect
        expr: relanox_unknown > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Relanox has an external effect requiring explicit recovery'
      - alert: RelanoxPendingTooLong
        expr: relanox_oldest_pending_age_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Relanox's oldest pending request is over 15 minutes old"
      - alert: RelanoxWorkerStalled
        expr: time() - relanox_worker_last_success_timestamp_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Relanox has not completed a durable batch recently'
      - alert: RelanoxChannelDisconnected
        expr: relanox_connection_status == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'At least one account in a Relanox channel plugin is disconnected'
      - alert: RelanoxStorageStatsStale
        expr: relanox_storage_stats_stale > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Relanox storage statistics could not be refreshed'
