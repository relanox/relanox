version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - nolintlint
    - staticcheck
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      # Keep the standard checks; stylistic quick fixes remain advisory.
      checks: [all, "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*"]
  exclusions:
    generated: strict
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
