name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    services:
      postgres:
        # An empty image disables this Linux-only service on the Windows runner.
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c' || '' }}
        env:
          POSTGRES_USER: relanox
          POSTGRES_PASSWORD: relanox-test
          POSTGRES_DB: relanox_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U relanox -d relanox_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RELANOX_TEST_POSTGRES_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgresql://relanox:relanox-test@127.0.0.1:5432/relanox_test' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          load: true
          tags: relanox:test
          cache-from: type=gha,scope=relanox
          cache-to: type=gha,mode=max,scope=relanox
      - name: Verify production image startup and restart
        run: pnpm exec vitest run tests/deployment/container.test.ts
        env:
          RELANOX_TEST_CONTAINER_IMAGE: relanox:test
